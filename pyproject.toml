[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-fuli-3d-bot"
version = "0.1.0"
description = "Python quant analysis and candidate generator for China Welfare Lottery 3D."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fuli3d = "fuli3d_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

